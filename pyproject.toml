[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "caravana"
version = "0.1.0"
description = "Orquestrador resiliente de sessões de navegador isoladas: retomada, artefatos auditáveis e relatórios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas Moreira Ferreira", email = "nicolasmoreiraferreira@users.noreply.github.com" }]
keywords = [
  "automation",
  "playwright",
  "orchestration",
  "scraping",
  "browser-context",
  "resilience",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.optional-dependencies]
# Núcleo instalável sem navegador: `validate`, `plan`, `show`, `report` e
# `verify` funcionam sem Playwright. Só a execução de fluxos exige o extra.
playwright = [
  "playwright>=1.45",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.5",
  "mypy>=1.11.2",
  # Usado diretamente nos testes da CLI (`click.testing.Result`). É dependência
  # transitiva do typer, mas importar um pacote direto sem declará-lo quebra
  # quando o typer trocar de backend — e foi o que aconteceu no CI.
  "click>=8.1",
]

[project.scripts]
caravana = "caravana.cli:main"

[project.urls]
Homepage = "https://github.com/nicolasmoreiraferreira/caravana"
Documentation = "https://github.com/nicolasmoreiraferreira/caravana/tree/main/docs"
Repository = "https://github.com/nicolasmoreiraferreira/caravana"
Issues = "https://github.com/nicolasmoreiraferreira/caravana/issues"
Changelog = "https://github.com/nicolasmoreiraferreira/caravana/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/caravana"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG", "RET", "TID", "PLC", "PLE"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLC0415"]
"examples/demo-site/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["caravana"]

[tool.mypy]
python_version = "3.11"
files = ["src/caravana"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# O Playwright é uma dependência opcional: numa instalação só com `[dev]` — que
# é o caso do job de lint — ele não existe, e o mypy precisa continuar
# verificando o resto do código em vez de reprovar o ambiente.
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: testes que abrem um navegador real (Playwright)",
  "slow: testes que levam mais de alguns segundos",
]

[tool.coverage.run]
branch = true
source = ["src/caravana"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
